openapi: "3.0.3"
info:
  title: Scalar Header and Cookie Parameters
  version: "1.0.0"
paths:
  /prefs:
    get:
      operationId: getPrefs
      parameters:
        - {name: sid, in: cookie, required: true, schema: {type: string}}
        - {name: count, in: cookie, schema: {type: integer}}
        - {name: count32, in: cookie, required: true, schema: {type: integer, format: int32}}
        - {name: count64, in: cookie, schema: {type: integer, format: int64}}
        - {name: ratio, in: cookie, schema: {type: number}}
        - {name: beta, in: cookie, schema: {type: boolean}}
        - {name: device, in: cookie, schema: {type: string, format: uuid}}
        - {name: since, in: cookie, schema: {type: string, format: date-time}}
        - {name: theme, in: cookie, schema: {$ref: "#/components/schemas/Theme"}}
        - {name: mode, in: cookie, schema: {type: string, enum: [compact, wide]}}
        - {name: token, in: cookie, schema: {$ref: "#/components/schemas/Token"}}
        - {name: X-Sid, in: header, required: true, schema: {type: string}}
        - {name: X-Count, in: header, schema: {type: integer}}
        - {name: X-Count32, in: header, required: true, schema: {type: integer, format: int32}}
        - {name: X-Count64, in: header, schema: {type: integer, format: int64}}
        - {name: X-Ratio, in: header, schema: {type: number}}
        - {name: X-Beta, in: header, schema: {type: boolean}}
        - {name: X-Device, in: header, schema: {type: string, format: uuid}}
        - {name: X-Since, in: header, schema: {type: string, format: date-time}}
        - {name: X-Theme, in: header, schema: {$ref: "#/components/schemas/Theme"}}
        - {name: X-Mode, in: header, schema: {type: string, enum: [compact, wide]}}
        - {name: X-Token, in: header, schema: {$ref: "#/components/schemas/Token"}}
        - {name: X-Tags, in: header, required: true, schema: {type: array, items: {type: string}}}
        - {name: q_sid, in: query, required: true, schema: {type: string}}
        - {name: q_count, in: query, schema: {type: integer}}
        - {name: q_count32, in: query, required: true, schema: {type: integer, format: int32}}
        - {name: q_count64, in: query, schema: {type: integer, format: int64}}
        - {name: q_ratio, in: query, schema: {type: number}}
        - {name: q_beta, in: query, schema: {type: boolean}}
        - {name: q_device, in: query, schema: {type: string, format: uuid}}
        - {name: q_since, in: query, schema: {type: string, format: date-time}}
        - {name: q_theme, in: query, schema: {$ref: "#/components/schemas/Theme"}}
        - {name: q_mode, in: query, required: true, schema: {type: string, enum: [compact, wide]}}
        - {name: q_token, in: query, schema: {$ref: "#/components/schemas/Token"}}
        - {name: q_tags, in: query, required: true, schema: {type: array, items: {type: string}}}
        - {name: q_themes, in: query, schema: {type: array, items: {$ref: "#/components/schemas/Theme"}}}
      responses:
        "204":
          description: ok
  /events:
    get:
      operationId: streamEvents
      parameters:
        - {name: sid, in: cookie, required: true, schema: {type: string}}
        - {name: since, in: cookie, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: events
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
components:
  schemas:
    Theme: {type: string, enum: [light, dark]}
    Token: {type: string}
    Event:
      type: object
      properties:
        id: {type: string}
