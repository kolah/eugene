openapi: "3.0.3"
info:
  title: Routing Test
  version: "1.0.0"
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItem"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getItem
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    put:
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItem"
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteItem
      responses:
        "204":
          description: Deleted
  /legacy-links:
    get:
      operationId: listLegacyLinks
      parameters:
        - name: kinds
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              enum: [post, folder, category]
        - name: scopes
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LinkScope"
      responses:
        "204":
          description: Found
  /legacy-links/{kind}/{scope}:
    get:
      operationId: getLegacyLink
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [post, folder, category]
        - name: scope
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LinkScope"
      responses:
        "204":
          description: Found
components:
  schemas:
    LinkScope:
      type: string
      enum: [public, private]
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    NewItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
